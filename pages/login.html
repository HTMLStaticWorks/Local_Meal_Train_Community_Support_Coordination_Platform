<!DOCTYPE html>
<html class="dark" dir="ltr" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="Coordinator Login — MealTrain Direct" name="description"/>
    <title>Coordinator Login | MealTrain Direct</title>
    <link href="../assets/favicon.svg" rel="icon" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config={darkMode:'class',theme:{extend:{colors:{
        brand:{50:'#fff4f1',100:'#ffe5df',200:'#ffc9bd',300:'#f7a897',500:'#e85d4a',600:'#d94c3b',700:'#b83b2d'},
        sage:{50:'#effaf7',100:'#d7f2ea',300:'#7cc9b0',400:'#4fd1c5',500:'#2f9b7b',600:'#257f66',700:'#1e6553'},
        gold:{50:'#fff9e9',100:'#fff0bd',500:'#f2b84b',600:'#d99a24'}
        }}}};
    </script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
    <link href="../css/styles.css" rel="stylesheet"/>
</head>
<body class="minimal-chrome bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between font-['Plus_Jakarta_Sans'] relative">

<!-- Top Right Floating Controls -->
<div class="fixed top-5 right-5 z-50 flex items-center gap-2">
    <button aria-label="Toggle Theme" class="w-10 h-10 rounded-full bg-white/90 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:text-brand-500 dark:hover:text-white flex items-center justify-center backdrop-blur transition-all shadow-sm" id="themeToggle" onclick="toggleTheme()" type="button">
        <i class="fa-solid fa-gear text-sm" id="navThemeIcon"></i>
    </button>
    <button class="px-3.5 h-10 rounded-full bg-white/90 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:text-brand-500 dark:hover:text-white font-bold text-xs flex items-center justify-center backdrop-blur transition-all shadow-sm" id="rtlToggle" onclick="toggleRTL()" type="button">
        RTL
    </button>
</div>

<main class="flex-1 flex items-center justify-center px-4 py-12 min-h-[calc(100vh-2rem)]">
    <section class="page active w-full flex items-center justify-center" id="login">
        <div class="w-full max-w-[440px] mx-auto">
            <div class="rounded-[32px] bg-white dark:bg-[#16212e] border border-slate-200 dark:border-slate-800/90 shadow-2xl p-7 sm:p-9 text-slate-800 dark:text-slate-100 relative">
                
                <!-- Brand Header -->
                <div class="text-center">
                    <a aria-label="MealTrain Direct Home" class="inline-flex items-center justify-center gap-2.5 text-slate-900 dark:text-white group text-decoration-none mb-3" href="../index.html">
                        <span class="w-9 h-9 rounded-xl bg-brand-500 text-white flex items-center justify-center shadow-md shadow-brand-500/25 group-hover:scale-105 transition-transform">
                            <i class="fa-solid fa-utensils text-base"></i>
                        </span>
                        <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">MealTrain <span class="text-brand-500">Direct</span></span>
                    </a>
                    
                    <h1 class="mt-2 text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white text-center tracking-tight">Welcome Back</h1>
                    <p class="mt-2 text-xs sm:text-sm text-slate-500 dark:text-slate-400 text-center leading-relaxed max-w-xs mx-auto">
                        Enter your credentials to manage your community meal trains.
                    </p>
                </div>

                <!-- Form Section -->
                <form class="mt-6 space-y-4" onsubmit="loginDemo(event)">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 text-left">Email Address</label>
                        <input class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-300 dark:border-slate-700/70 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition-all" placeholder="coordinator@mealtraindirect.com" required="" type="email"/>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 text-left">Password</label>
                        <input class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-300 dark:border-slate-700/70 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition-all" placeholder="••••••••" required="" type="password"/>
                    </div>

                    <div class="flex items-center justify-between text-xs sm:text-sm pt-1">
                        <label class="flex items-center gap-2 font-medium text-slate-600 dark:text-slate-300 cursor-pointer select-none group">
                            <input class="rounded border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-brand-500 focus:ring-brand-500 w-4 h-4 cursor-pointer group-hover:border-brand-500 transition-colors" type="checkbox"/>
                            <span class="group-hover:text-slate-900 dark:group-hover:text-white transition-colors">Remember me</span>
                        </label>
                        <button class="font-semibold text-brand-500 dark:text-brand-400 hover:text-brand-600 dark:hover:text-brand-300 hover:underline hover:scale-[1.04] active:scale-[0.96] transition-all duration-200 cursor-pointer inline-block" onclick="alert('Demo: Password reset link sent to your email.')" type="button">
                            Forgot password?
                        </button>
                    </div>

                    <button class="w-full py-3.5 mt-2 rounded-full bg-brand-500 hover:bg-brand-600 text-white font-extrabold text-sm transition-all duration-200 shadow-lg shadow-brand-500/25 hover:shadow-xl hover:shadow-brand-500/40 hover:scale-[1.02] active:scale-[0.98] cursor-pointer" type="submit">
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="my-6 flex items-center gap-3">
                    <span class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></span>
                    <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">OR</span>
                    <span class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></span>
                </div>

                <!-- Social Sign In -->
                <div class="grid grid-cols-2 gap-3">
                    <button class="py-2.5 px-4 rounded-full border border-slate-300 dark:border-slate-700/80 bg-slate-100/60 dark:bg-slate-800/40 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 hover:text-brand-500 dark:hover:text-white font-semibold text-xs sm:text-sm flex items-center justify-center gap-2 hover:border-brand-500/50 dark:hover:border-brand-500/50 hover:shadow-md hover:shadow-brand-500/10 hover:scale-[1.03] active:scale-[0.97] transition-all duration-200 cursor-pointer" onclick="socialDemo('Google')" type="button">
                        <svg class="w-4 h-4 shrink-0 transition-transform group-hover:scale-110" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
                        </svg>
                        <span>Google</span>
                    </button>
                    
                    <button class="py-2.5 px-4 rounded-full border border-slate-300 dark:border-slate-700/80 bg-slate-100/60 dark:bg-slate-800/40 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 hover:text-brand-500 dark:hover:text-white font-semibold text-xs sm:text-sm flex items-center justify-center gap-2 hover:border-brand-500/50 dark:hover:border-brand-500/50 hover:shadow-md hover:shadow-brand-500/10 hover:scale-[1.03] active:scale-[0.97] transition-all duration-200 cursor-pointer" onclick="socialDemo('Apple')" type="button">
                        <i class="fa-brands fa-apple text-base shrink-0"></i>
                        <span>Apple</span>
                    </button>
                </div>

                <!-- Footer Link -->
                <p class="mt-7 text-center text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                    Don't have an account? <a class="font-extrabold text-brand-500 dark:text-brand-400 hover:text-brand-600 dark:hover:text-brand-300 hover:underline hover:scale-105 inline-block transition-all duration-200" href="register.html">Create One</a>
                </p>

            </div>
        </div>
    </section>
</main>

<!-- Floating Scroll Top Button -->
<button aria-label="Scroll to top" class="bg-brand-500 hover:bg-brand-600 text-white transition-transform hover:scale-110 cursor-pointer" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <i class="fa-solid fa-arrow-up text-base"></i>
</button>

<script src="../js/main.js"></script>
</body>
</html>
